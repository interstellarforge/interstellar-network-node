name: Validate

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate shell scripts
        run: |
          bash -n toolbox/interstellar-network-toolbox.sh
          bash -n install.sh
          bash -n scripts/release.sh
          bash -n scripts/configure-repository.sh

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Check embedded control sources are current
        run: |
          python3 scripts/embed-control.py
          git diff --exit-code toolbox/interstellar-network-toolbox.sh

      - name: Unit tests
        run: python3 -m unittest tests.test_serve tests.test_control tests.test_wol
